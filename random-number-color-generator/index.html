
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number & Color Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Random Number & Color Generator</h1>
        <div class="display">
            <div id="number-display">-</div>
            <div id="color-display" class="color-box">-</div>
            <div id="color-value">-</div>
        </div>
        <div class="buttons">
            <button id="random-number">New Number</button>
            <button id="random-color">New Color</button>
            <button id="random-both">Random Both</button>
            <button id="copy-color">Copy Color</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
