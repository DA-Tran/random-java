
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Sorting Visualizer</h1>
        <div class="controls">
            <button id="generate">Generate Array</button>
            <button id="bubble">Bubble Sort</button>
            <button id="merge">Merge Sort</button>
            <button id="quick">Quick Sort</button>
            <div class="info">
                <span id="size">Size: 100</span>
                <span id="time">Time: 0ms</span>
                <span id="compares">Compares: 0</span>
            </div>
        </div>
        <canvas id="canvas" width="900" height="500"></canvas>
    </div>
    <script src="script.js"></script>
</body>
</html>
