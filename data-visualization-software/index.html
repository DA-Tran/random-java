
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Visualization (Random Data)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Data Visualization Software</h1>
        <div class="controls">
            <button id="generate-data">Generate Random Data</button>
            <select id="chart-type">
                <option value="bar">Bar Chart</option>
                <option value="line">Line Chart</option>
                <option value="pie">Pie Chart</option>
            </select>
            <button id="animate">Animate</button>
        </div>
        <canvas id="chartCanvas" width="900" height="500"></canvas>
        <div class="stats">
            <span>Dataset size: <span id="dataset-size">0</span></span>
            <span>Avg: <span id="avg">0</span></span>
            <span>Max: <span id="max">0</span></span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
