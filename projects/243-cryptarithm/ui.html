<div class="card">
  <h2>Input</h2>
  <p class="hint">Solve puzzles like SEND + MORE = MONEY by assigning a digit to each letter.</p>
  <div class="row">
    <label class="field">
      <span>Input</span>
      <input data-field="input" placeholder="type something" autocomplete="off">
    </label>
    <div class="tight"><button data-action="compute" data-primary>Run</button></div>
  </div>
</div>

<div class="card">
  <h2>Result</h2>
  <div id="out" class="out"><p class="empty">Nothing yet.</p></div>
</div>
