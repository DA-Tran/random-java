<div class="card">
  <h2>Sieve</h2>
  <p class="hint">Every prime up to a limit, using the sieve of Eratosthenes.</p>
  <div class="row">
    <label class="field">
      <span>Upper limit</span>
      <input data-field="limit" type="number" value="200" min="2" max="5000000">
    </label>
    <div class="tight"><button data-action="sieve" data-primary>List primes</button></div>
  </div>
</div>

<div class="card">
  <h2>Single number</h2>
  <p class="hint">Test one value for primality, or break it into prime factors.</p>
  <div class="row">
    <label class="field">
      <span>Number</span>
      <input data-field="value" type="number" value="360">
    </label>
    <div class="tight"><button class="ghost" data-action="test">Is it prime?</button></div>
    <div class="tight"><button class="ghost" data-action="factorise">Factorise</button></div>
  </div>
</div>

<div class="card">
  <h2>Result</h2>
  <div id="out" class="out"><p class="empty">Pick an action above.</p></div>
</div>
