<div class="card">
  <h2>Controls</h2>
  <p class="hint">
    Ferry everyone to the far bank. Nothing may be left on a bank with something
    that would eat it - but the ferryman's presence keeps the peace, so only the
    bank he has just left can be in trouble.
  </p>
  <div class="row">
    <label class="field">
      <span>Puzzle</span>
      <select data-field="puzzle">
        <option value="classic">Wolf, goat and cabbage</option>
        <option value="missionaries">Missionaries and cannibals</option>
      </select>
    </label>
    <div class="tight"><button data-action="generate" data-primary>Reset</button></div>
    <div class="tight"><button class="quiet" data-action="solve">Solve</button></div>
  </div>
</div>

<div class="card" data-boot="generate">
  <h2>Banks and crossings</h2>
  <div id="items"></div>
  <div id="out" class="out"></div>
</div>
