<div class="card">
  <h2>Controls</h2>
  <p class="hint">
    Click a peg to pick it up, then click the empty hole two cells away in a
    straight line. The peg you jump over is removed. Leave one, in the middle.
  </p>
  <div class="row">
    <label class="field">
      <span>Board</span>
      <select data-field="board">
        <option value="english">English (33 holes)</option>
        <option value="european">European (37 holes)</option>
      </select>
    </label>
    <div class="tight"><button data-action="generate" data-primary>New board</button></div>
    <div class="tight"><button class="ghost" data-action="hint">Hint</button></div>
    <div class="tight"><button class="ghost" data-action="undo">Undo</button></div>
    <div class="tight"><button class="quiet" data-action="solve">Solve</button></div>
  </div>
</div>

<div class="card" data-boot="generate">
  <h2>Board</h2>
  <div id="board"></div>
  <div id="out" class="out"></div>
</div>

<script>
  document.addEventListener('click', function (event) {
    var cell = event.target.closest('#board .cell');
    if (!cell) { return; }
    var wrap = cell.parentElement;
    var match = /repeat\((\d+)/.exec(wrap.style.gridTemplateColumns || '');
    if (!match) { return; }
    var columns = parseInt(match[1], 10);
    var index = Array.prototype.indexOf.call(wrap.children, cell);
    RJ.send('touch', { row: Math.floor(index / columns), col: index % columns });
  });
</script>
