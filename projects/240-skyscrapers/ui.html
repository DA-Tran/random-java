<div class="card">
  <h2>Controls</h2>
  <p class="hint">
    Each height appears once per row and once per column. The numbers around the
    edge count the towers visible looking in from that side - a taller tower
    hides everything behind it. Pick a height, then click a plot to build;
    clicking the same height again clears the plot.
  </p>
  <div class="row">
    <label class="field">
      <span>City size</span>
      <input data-field="size" type="number" value="5" min="4" max="6">
    </label>
    <label class="field">
      <span>Storeys to build</span>
      <input data-field="value" type="number" value="1" min="1" max="6">
    </label>
    <div class="tight"><button data-action="generate" data-primary>New city</button></div>
    <div class="tight"><button class="ghost" data-action="hint">Hint</button></div>
    <div class="tight"><button class="quiet" data-action="solve">Solve</button></div>
  </div>
</div>

<div class="card" data-boot="generate">
  <h2>City</h2>
  <div id="board"></div>
  <div id="out" class="out"></div>
</div>

<script>
  document.addEventListener('click', function (event) {
    var cell = event.target.closest('#board .cell');
    if (!cell) { return; }
    var wrap = cell.parentElement;
    var match = /repeat\((\d+)/.exec(wrap.style.gridTemplateColumns || '');
    if (!match) { return; }
    var columns = parseInt(match[1], 10);
    var index = Array.prototype.indexOf.call(wrap.children, cell);
    // The clues ring the city, so the server drops clicks on the outer edge.
    RJ.send('place', { row: Math.floor(index / columns), col: index % columns });
  });
</script>
