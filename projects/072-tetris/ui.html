<div class="card">
  <h2>Controls</h2>
  <p class="hint">a and d move, w rotates (kicking off a wall if it must), space hard-drops.</p>
  <div class="row">
    <div class="tight"><button data-action="generate" data-primary>New game</button></div>
    <div class="tight"><button class="ghost" data-action="rotate">Rotate</button></div>
    <div class="tight"><button class="ghost" data-action="step">Down</button></div>
    <div class="tight"><button class="quiet" data-action="solve">Hard drop</button></div>
  </div>
</div>

<div class="card" data-boot="generate">
  <h2>Board</h2>
  <div id="board"></div>
  <div id="out" class="out"></div>
</div>

<script>
  document.addEventListener('keydown', function (event) {
    var map = {
      ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right',
      ArrowUp: 'rotate', w: 'rotate', ArrowDown: 'step', s: 'step', ' ': 'solve'
    };
    var action = map[event.key];
    if (!action) { return; }
    if (document.activeElement && document.activeElement.tagName === 'INPUT') { return; }
    event.preventDefault();
    RJ.send(action);
  });
</script>
