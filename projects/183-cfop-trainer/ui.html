<div class="card">
  <h2>Drill</h2>
  <p class="hint">
    Each case is generated by running its own algorithm backwards from solved, so
    the puzzle and the answer can never disagree. Your answer is checked by
    actually applying it, not by matching text, so any correct solution passes.
  </p>
  <div class="row">
    <label class="field">
      <span>Group</span>
      <select data-field="group">
        <option value="">Anything</option>
        <option value="PLL">PLL only</option>
        <option value="OLL">OLL only</option>
      </select>
    </label>
    <div class="tight"><button data-action="draw" data-primary>New case</button></div>
    <div class="tight"><button class="quiet" data-action="reveal">Show me</button></div>
  </div>
  <div id="board" style="margin-top:18px"></div>
  <div class="row" style="margin-top:16px">
    <label class="field">
      <span>Your algorithm</span>
      <input data-field="answer" placeholder="R U R' U' ..." autocomplete="off" spellcheck="false">
    </label>
    <div class="tight"><button class="ghost" data-action="answer">Check</button></div>
  </div>
  <div id="out" class="out" style="margin-top:16px"></div>
</div>

<div class="card" data-boot="list">
  <h2>Every case</h2>
  <div id="items"></div>
</div>
