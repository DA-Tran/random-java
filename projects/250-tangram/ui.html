<div class="card">
  <h2>Controls</h2>
  <p class="hint">
    Seven pieces - two large triangles, a medium, two small, a square and a
    parallelogram - tile the square exactly. Each cell is drawn as its four
    micro-triangles, so a block of one letter is one piece and the boundaries
    between pieces run at 45 degrees as they should.
  </p>
  <div class="row">
    <div class="tight"><button data-action="generate" data-primary>Clear</button></div>
    <div class="tight"><button class="quiet" data-action="solve">Fit the pieces</button></div>
  </div>
</div>

<div class="card" data-boot="generate">
  <h2>Square</h2>
  <div id="board"></div>
  <div id="out" class="out"></div>
</div>
